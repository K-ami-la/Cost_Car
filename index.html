<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coût réel d'une voiture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 🆕 Une voiture dessinée en SVG (un dessin fait avec du code) -->
  <svg class="voiture-dessin" viewBox="0 0 200 80" width="200">
    <path d="M20 55 L30 35 Q35 28 45 28 L120 28 Q130 28 140 38 L160 50 Q180 52 182 58 L182 62 L18 62 Z" fill="#2563eb"/>
    <path d="M48 34 L118 34 Q124 34 130 42 L45 42 Z" fill="#bfdbfe"/>
    <circle cx="55" cy="62" r="11" fill="#222"/>
    <circle cx="55" cy="62" r="5" fill="#ccc"/>
    <circle cx="145" cy="62" r="11" fill="#222"/>
    <circle cx="145" cy="62" r="5" fill="#ccc"/>
  </svg>

  <h1>Quelle voiture me coûte vraiment le moins cher ?</h1>

  <section>
    <h2>Mes trajets</h2>
    <label>Kilomètres par an <input type="number" id="km" value="12000"></label>
    <label>Durée (années) <input type="number" id="annees" value="5"></label>
  </section>

  <div class="voitures">
    <section id="carteA">                                          <!-- 🆕 id -->
      <div class="icone" id="iconeA">⛽</div>                       <!-- 🆕 -->
      <h2>Voiture A</h2>
      <label>Type                                                  <!-- 🆕 -->
        <select id="typeA">
          <option value="essence" selected>Essence</option>
          <option value="diesel">Diesel</option>
          <option value="electrique">Électrique</option>
        </select>
      </label>
      <label>Prix d'achat (€) <input type="number" id="prixA" value="10000"></label>
      <label>Consommation (L ou kWh / 100 km) <input type="number" id="consoA" value="6"></label>
      <label>Prix de l'énergie (€ par L ou kWh) <input type="number" id="energieA" value="1.80" step="0.01"></label>
    </section>

    <section id="carteB">                                          <!-- 🆕 id -->
      <div class="icone" id="iconeB">⚡</div>                       <!-- 🆕 -->
      <h2>Voiture B</h2>
      <label>Type                                                  <!-- 🆕 -->
        <select id="typeB">
          <option value="essence">Essence</option>
          <option value="diesel">Diesel</option>
          <option value="electrique" selected>Électrique</option>
        </select>
      </label>
      <label>Prix d'achat (€) <input type="number" id="prixB" value="13000"></label>
      <label>Consommation (L ou kWh / 100 km) <input type="number" id="consoB" value="16"></label>
      <label>Prix de l'énergie (€ par L ou kWh) <input type="number" id="energieB" value="0.25" step="0.01"></label>
    </section>
  </div>

  <button id="calculer">Calculer</button>
  <p id="resultat"></p>
  <canvas id="graphique"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
